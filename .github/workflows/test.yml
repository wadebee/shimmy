name: Shim Tests

on:
  pull_request:
    paths:
      - "install.sh"
      - "commands/**"
      - "lib/**"
      - "tests/**"
      - "tools/**"
      - "agent/**"
      - ".agents/skills/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/test.yml"
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/**"
      - "plugins/shimmy/**"
  push:
    paths:
      - "install.sh"
      - "commands/**"
      - "lib/**"
      - "tests/**"
      - "tools/**"
      - "agent/**"
      - ".agents/skills/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/test.yml"
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/**"
      - "plugins/shimmy/**"
  workflow_dispatch:

jobs:
  shim-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Podman Dependency
        run: podman --version
        
      - name: Remove github runner jq to force shim usage
        run: sudo rm /usr/bin/jq || true

      - name: Run shim tests
        run: ./tests/test.sh
